# Finance inputs. Unit costs USD 2026. [A]=ASSUMPTION (reason in research/model-notes.md).
years: 30                       # analysis horizon (annuity of revenue/opex)
life_years: {pipe: 30, tank: 30, equip: 20}   # [A] separate CRF by asset life: pipe/trench 30 (conservative vs 40-50), tank 30, heat pumps/HX/boilers/pumps 20 (code-review #10; replacement captured via the shorter-life CRF)
discount_rates: {coop_4pct: 0.04, utility_7pct: 0.07, private_10pct: 0.10}
elec_price_usd_kwh: 0.245       # facts-site2.md sec 4 (NYSEG residential, EnergySage) (verified 2026-10-03)
elec_price_central_usd_kwh: 0.108   # central HP + pumping behind DC utility service: NY industrial average 10.81 c/kWh, EIA Electric Power Monthly Table 5.6.A, July 2026 (https://www.eia.gov/electricity/monthly/epm_table_grapher.php?t=epmt_5_6_a). NYSEG SC-7 tariff not checked; a 100+ MW campus may get less
prices:                         # facts-site2.md sec 4, NYSERDA Central NY + EIA
  propane_usd_gal: 3.10         # ASSUMPTION base 3.10; verification.md row 7b: statewide $3.120 (2026-09-21), Central value unreadable; low sensitivity 2.85 (facts-site2 had 2.849)
  oil_usd_gal: 5.186
  gas_usd_therm: 1.60
  propane_kwh_gal: 26.8         # 91,452 BTU/gal
  oil_kwh_gal: 40.6             # 138,500 BTU/gal
  eff: {propane: 0.85, oil: 0.82, gas: 0.85}
  steam_usd_mwh: null
capex:
  dc_interface_usd_kw: 120      # [A] plate HX + isolation + N+1 + controls per kW peak DC draw
  tank_usd_m3: 300              # [A] steel atmospheric tank; Danish pit stores 33-38 EUR/m3 (iea-shc.org) are a floor
  onsite_pipe_usd_m: 900        # [A] pre-insulated twin pipe rural trench
  substation_usd_kw: 100        # [A] customer HX substation
  loop_pipe_usd_m: 450          # [A] uninsulated HDPE ambient loop rural; MIT OCW 2025: circulation ~1/3 of ~$50k per residence
  building_hp_usd: 16000        # [A] MIT OCW 2025 res-env-007 lec07: ~1/3 of ~$50k per residence in-home
  lateral_usd: 2500             # [A] service lateral + meter per home
  pump_plant_usd_kw: 40         # [A]
  backup_usd_kw: 120            # [A]
  trunk_usd_m: 1100             # [A] insulated twin pipe rural, DN150-200 incl. trench
  central_hp_usd_kw: 700        # [A] large HP 50->70 C
  soft_cost_pct: 0.15           # [A]
  contingency_pct: 0.20         # [A]
opex:
  om_pct_capex: 0.015           # [A]
  hp_service_usd_home: 150      # [A]
  customer_usd_home: 120        # [A]
  program_usd_yr: 400000        # [A] operator staff and insurance
  heat_purchase_usd_mwh: 0.0    # [A] heat at zero price (Deep Green precedent gives heat free)
tariff:
  discount_vs_propane: 0.20     # PLAN section 4.3 example
  low_income_discount: 0.35     # [A]
  low_income_share: 0.20        # [A]
  onsite_tariff_usd_mwh: 50     # [A] ~40% of propane-equivalent; greenhouse alternative without gas is propane/oil/electric
incentives:
  itc_pct: 0.30                 # incentive scenario ONLY, "if structured to qualify (counsel needed)": waste-heat network most likely not eligible (verification.md 9d-i); base = no credit
dc_exit:
  year: 10
  replacement_source_usd_kw: 2000   # [A]
tornado:
  pipe_cost: [0.7, 1.4]
  elec_price: [0.14, 0.32]
  eta: [0.4, 0.6]
  uptake: [0.45, 0.90]
  discount_rate: [0.04, 0.10]
  dc_it_mw: [75, 320]
tariff_scenarios_discount: [0.15, 0.20, 0.25]   # 0.85x / 0.80x / 0.75x propane-equivalent (coordinator note: Windows lane used 0.75x)
cost_split:                      # OCP p7-8 (digest sec 2.4): extraction costs split DC + host; transformation (storage, lift, HPs) paid by host
  dc_interface: {dc: 0.5, host: 0.5}
reference_checks:                # CBS white paper p13,17,19 (digest sec 4.2): 10 MW HP plant ~EUR 6M, ~9 yr simple payback; connection cost 3% -> 50% of capex from 50 m to 4 km
  cbs_hp_plant_eur_per_mw: 600000
  eur_usd: 1.08                  # [A]
  cbs_poor_distance_km: 2.0
cba:
  dc_capex_usd_per_mw_it: 10000000   # Turner & Townsend Data Centre Construction Cost Index 2025: US$6.6-13.3 per W across markets; ~$10/W midpoint [A] for Upstate NY (https://reports.turnerandtownsend.com/data-centre-construction-cost-index-2025/)
